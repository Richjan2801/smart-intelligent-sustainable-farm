services:
  # ── Database ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: sisf-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── ML Predictor ─────────────────────────────────────────────────────────────
  xgb-api:
    build:
      context: ./predictor
    container_name: xgb-api
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Backend ───────────────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: sisf-backend
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Override localhost values with Docker service names for internal networking
      DB_HOST: postgres
      DB_PORT: 5432
      XGB_API_URL: http://xgb-api:5000
    depends_on:
      postgres:
        condition: service_healthy
      xgb-api:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    container_name: sisf-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
